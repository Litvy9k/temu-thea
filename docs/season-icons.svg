<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 96" width="520" height="192">
  <!--
    Season icons, source drawing. 16x16 grid, all in currentColor, so the season
    colour is applied by setting `color` on the element (or its parent).
    No masks and no ids inside the shapes, so they can be inlined any number of
    times on one page. Partial fills use group opacity / fill-opacity, so
    overlapping petals do not stack into a darker colour.
    spring #f0a6c8 flower · summer #b5d86a sun · autumn #e0a24e leaf · winter #8fc8f0 snowflake
  -->
  <defs>
    <symbol id="spring" viewBox="0 0 16 16">
      <g fill="currentColor" opacity="0.75">
        <circle cx="8" cy="4.4" r="2.5"/>
        <circle cx="11.42" cy="6.89" r="2.5"/>
        <circle cx="10.12" cy="10.91" r="2.5"/>
        <circle cx="5.88" cy="10.91" r="2.5"/>
        <circle cx="4.58" cy="6.89" r="2.5"/>
      </g>
      <circle cx="8" cy="8" r="1.8" fill="currentColor"/>
    </symbol>
    <symbol id="summer" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="3.1" fill="currentColor"/>
      <path d="M13 8H15M11.54 11.54L12.95 12.95M8 13V15M4.46 11.54L3.05 12.95M3 8H1M4.46 4.46L3.05 3.05M8 3V1M11.54 4.46L12.95 3.05"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="autumn" viewBox="0 0 16 16">
      <path d="M3.5 12.5C3.5 6 7.2 2.5 13.5 2.5C13.5 8.8 10 12.5 3.5 12.5Z"
            fill="currentColor" fill-opacity="0.45" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M1.8 14.2L11 5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="winter" viewBox="0 0 16 16">
      <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none">
        <path d="M8 1.5V14.5M2.37 4.75L13.63 11.25M2.37 11.25L13.63 4.75"/>
        <path d="M6.44 2.24L8 3.8L9.56 2.24M12.21 3.77L11.64 5.9L13.76 6.47M13.76 9.53L11.64 10.1L12.21 12.23M9.56 13.76L8 12.2L6.44 13.76M3.79 12.23L4.36 10.1L2.24 9.53M2.24 6.47L4.36 5.9L3.79 3.77"/>
      </g>
    </symbol>
  </defs>

  <rect width="260" height="96" fill="#0a1418"/>

  <!-- large -->
  <use href="#spring" x="14" y="8" width="40" height="40" style="color:#f0a6c8"/>
  <use href="#summer" x="78" y="8" width="40" height="40" style="color:#b5d86a"/>
  <use href="#autumn" x="142" y="8" width="40" height="40" style="color:#e0a24e"/>
  <use href="#winter" x="206" y="8" width="40" height="40" style="color:#8fc8f0"/>

  <!-- HUD size: 13px icon before the season character -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="13">
    <use href="#spring" x="10" y="64" width="13" height="13" style="color:#f0a6c8"/>
    <text x="26" y="75" fill="#f0a6c8">春</text>
    <use href="#summer" x="74" y="64" width="13" height="13" style="color:#b5d86a"/>
    <text x="90" y="75" fill="#b5d86a">夏</text>
    <use href="#autumn" x="138" y="64" width="13" height="13" style="color:#e0a24e"/>
    <text x="154" y="75" fill="#e0a24e">秋</text>
    <use href="#winter" x="202" y="64" width="13" height="13" style="color:#8fc8f0"/>
    <text x="218" y="75" fill="#8fc8f0">冬</text>
  </g>
</svg>
